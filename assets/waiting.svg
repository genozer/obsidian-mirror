<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Obsidian Mirror: waiting for the phone (phone → waves → screen-mirroring tile) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- signal waves -->
  <g fill="none" stroke="#a78bfa" stroke-linecap="round">
    <path d="M58 100 a42 42 0 0 1 84 0" stroke-width="5" opacity="0.35"/>
    <path d="M40 100 a60 60 0 0 1 120 0" stroke-width="5" opacity="0.2"/>
    <path d="M22 100 a78 78 0 0 1 156 0" stroke-width="5" opacity="0.1"/>
  </g>
  <!-- control-center style tile -->
  <rect x="64" y="64" width="72" height="72" rx="20" fill="url(#tile)"/>
  <!-- two overlapping screens (screen mirroring) -->
  <rect x="78" y="80" width="30" height="22" rx="4" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.65"/>
  <rect x="92" y="94" width="30" height="22" rx="4" fill="#ffffff"/>
  <!-- phone below -->
  <rect x="86" y="146" width="28" height="44" rx="7" fill="none" stroke="#d4d4d8" stroke-width="4"/>
  <rect x="95" y="150" width="10" height="3" rx="1.5" fill="#d4d4d8"/>
</svg>
