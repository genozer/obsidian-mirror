<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Obsidian Mirror: waiting for an Android phone on a USB cable -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- phone -->
  <rect x="62" y="18" width="76" height="132" rx="14" fill="none" stroke="#d4d4d8" stroke-width="5"/>
  <rect x="72" y="32" width="56" height="96" rx="6" fill="url(#g)" opacity="0.9"/>
  <!-- two overlapping screens on the phone (mirroring) -->
  <rect x="82" y="60" width="24" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.7"/>
  <rect x="94" y="70" width="24" height="18" rx="3" fill="#ffffff"/>
  <!-- USB cable -->
  <rect x="91" y="150" width="18" height="12" rx="2" fill="#d4d4d8"/>
  <path d="M100 162 v14 q0 10 10 10 h40" fill="none" stroke="#a1a1aa" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="186" r="6" fill="#a1a1aa"/>
</svg>
